<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Карточная сортировка</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: #f4f5f7;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1c2b4a;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b7684; font-size: 14px; margin: 0 0 24px; }
  h2 { font-size: 16px; margin: 0 0 12px; }

  .columns { display: flex; gap: 24px; flex-wrap: wrap; }
  .col { flex: 1 1 320px; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 4px 14px rgba(28,43,74,0.08); }

  .editor-item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #e6e8ec; border-radius: 8px; margin-bottom: 8px; }
  .editor-item input[type="text"] { border: 1px solid #dcdfe4; border-radius: 6px; padding: 8px; font-size: 14px; }
  .editor-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .editor-fields input[type="text"] { flex: none; width: 100%; }
  .thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #f0f1f4; flex: none; }
  .thumb-empty { width: 40px; height: 40px; border-radius: 6px; background: #f0f1f4; flex: none; }
  .icon-btn { border: none; background: #f0f1f4; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 14px; flex: none; }
  .icon-btn:hover { background: #e6e8ec; }
  .icon-btn.danger { color: #e8262b; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .add-btn { width: 100%; padding: 10px; border: 1px dashed #c7cbd3; border-radius: 8px; background: #fafbfc; color: #6b7684; cursor: pointer; font-size: 14px; margin-top: 4px; }
  .add-btn:hover { background: #f0f1f4; }

  .primary-btn { background: #e8262b; color: #fff; border: none; border-radius: 8px; padding: 12px 22px; font-size: 15px; cursor: pointer; }
  .primary-btn:hover { background: #cf2126; }
  .primary-btn:disabled { background: #d9b9ba; cursor: not-allowed; }

  .actions-bar { margin-top: 24px; display: flex; align-items: center; gap: 14px; }
  .hint { color: #6b7684; font-size: 13px; }
  .error-msg { color: #e8262b; font-size: 13px; margin-top: 8px; }

  .link-box { margin-top: 20px; background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 4px 14px rgba(28,43,74,0.08); display: none; }
  .link-box.show { display: block; }
  .link-row { display: flex; gap: 8px; margin-top: 8px; }
  .link-row input { flex: 1; padding: 10px; border: 1px solid #dcdfe4; border-radius: 6px; font-size: 14px; }
  .link-row button { border: none; background: #1c2b4a; color: #fff; border-radius: 6px; padding: 0 16px; cursor: pointer; }

  /* respondent view */
  .sort-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
  .sort-header h1 { margin: 0; }
  .sort-progress { font-size: 14px; font-weight: 700; color: #e8262b; white-space: nowrap; }
  .sort-subheader { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
  .sort-hint { font-size: 12px; color: #6b7684; }
  .sort-remaining { font-size: 12px; font-weight: 700; color: #e8262b; white-space: nowrap; }

  .sort-columns { display: flex; gap: 14px; align-items: flex-start; }
  .sort-column { flex: 1 1 0; min-width: 0; }
  .col-title { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #8a93a3; margin-bottom: 10px; }

  .queue-list, .cats-list { display: flex; flex-direction: column; gap: 8px; }

  .queue-card {
    background: #fff; border-radius: 10px; padding: 10px; box-shadow: 0 2px 6px rgba(28,43,74,0.07);
    opacity: 0.55; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .queue-card.active { opacity: 1; cursor: grab; touch-action: none; box-shadow: 0 4px 12px rgba(28,43,74,0.12); }
  .queue-card.dragging { opacity: 0.35; }
  .queue-card-top { display: flex; align-items: center; gap: 8px; }
  .queue-card-thumb { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; flex: none; pointer-events: none; -webkit-user-drag: none; user-drag: none; }
  .queue-card-title { font-size: 13px; font-weight: 600; word-break: break-word; }
  .queue-card-meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; font-size: 11px; }
  .queue-index { color: #b4bac4; }
  .queue-status { color: #b4bac4; }
  .queue-card.active .queue-status { color: #e8262b; font-weight: 700; }

  .cat-row {
    background: #fff; border-radius: 10px; padding: 10px; box-shadow: 0 2px 6px rgba(28,43,74,0.07);
    border: 2px solid transparent; cursor: pointer;
  }
  .cat-row.drop-hover { border-color: #e8262b; background: #fdecec; }
  .cat-row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cat-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; min-width: 0; }
  .cat-title span { word-break: break-word; }
  .cat-thumb { width: 24px; height: 24px; border-radius: 6px; object-fit: cover; flex: none; pointer-events: none; -webkit-user-drag: none; user-drag: none; }
  .cat-badge {
    width: 22px; height: 22px; border-radius: 50%; background: #e8262b; color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .cat-chips { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .cat-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #f4f5f7;
    border-radius: 7px; padding: 6px 8px; font-size: 12px;
  }
  .cat-chip span { word-break: break-word; }
  .cat-chip-remove { border: none; background: none; color: #8a93a3; cursor: pointer; font-size: 13px; line-height: 1; flex: none; }
  .cat-chip-remove:hover { color: #e8262b; }

  .drag-ghost { position: fixed; z-index: 1000; pointer-events: none; width: 200px; }

  .center-screen { max-width: 480px; margin: 80px auto; text-align: center; background: #fff; padding: 32px; border-radius: 14px; box-shadow: 0 8px 24px rgba(28,43,74,0.12); }
  .center-screen h2 { margin-bottom: 8px; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
(function () {
  // ВСТАВЬТЕ СЮДА URL вашего развёрнутого Google Apps Script Web App (см. Code.gs / инструкцию)
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSZR_WKkzvLWUJWg1ravOa56hBZZoveAfpSmYXTgaotx8xLVmYdZ7rMt5zZzM7ImU6/exec';

  var app = document.getElementById('app');
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get('s');

  function uid() {
    return 'id-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  // ---------------------------------------------------------------------
  // РЕЖИМ ИССЛЕДОВАТЕЛЯ (нет параметра ?s=)
  // ---------------------------------------------------------------------
  function renderAdmin() {
    var state = {
      categories: [{ id: uid(), label: '', description: '', image: null }, { id: uid(), label: '', description: '', image: null }],
      items: [{ id: uid(), label: '', image: null }]
    };

    app.innerHTML = '';
    app.appendChild(el('h1', { text: 'Карточная сортировка — настройка' }));
    app.appendChild(el('p', { class: 'sub', text: 'Заполните категории и разделы (текст и/или картинка), затем опубликуйте — появится ссылка для респондентов.' }));

    var columns = el('div', { class: 'columns' });
    var catCol = el('div', { class: 'col' });
    catCol.appendChild(el('h2', { text: 'Категории' }));
    var catList = el('div');
    catCol.appendChild(catList);
    var addCatBtn = el('button', { class: 'add-btn', text: '+ Добавить категорию', onclick: function () {
      state.categories.push({ id: uid(), label: '', description: '', image: null });
      renderList(catList, state.categories, false);
    }});
    catCol.appendChild(addCatBtn);

    var itemCol = el('div', { class: 'col' });
    itemCol.appendChild(el('h2', { text: 'Разделы (карточки для сортировки)' }));
    var itemList = el('div');
    itemCol.appendChild(itemList);
    var addItemBtn = el('button', { class: 'add-btn', text: '+ Добавить раздел', onclick: function () {
      state.items.push({ id: uid(), label: '', image: null });
      renderList(itemList, state.items, true);
    }});
    itemCol.appendChild(addItemBtn);

    columns.appendChild(catCol);
    columns.appendChild(itemCol);
    app.appendChild(columns);

    var actionsBar = el('div', { class: 'actions-bar' });
    var publishBtn = el('button', { class: 'primary-btn', text: 'Опубликовать и получить ссылку', onclick: onPublish });
    actionsBar.appendChild(publishBtn);
    actionsBar.appendChild(el('span', { class: 'hint', text: 'Минимум 2 категории и 1 раздел.' }));
    app.appendChild(actionsBar);

    var errorBox = el('div', { class: 'error-msg' });
    app.appendChild(errorBox);

    var linkBox = el('div', { class: 'link-box' });
    app.appendChild(linkBox);

    function renderList(container, list, isItem) {
      container.innerHTML = '';
      list.forEach(function (entry) {
        var row = el('div', { class: 'editor-item' });
        var thumb = entry.image
          ? el('img', { class: 'thumb', src: entry.image })
          : el('div', { class: 'thumb-empty' });
        row.appendChild(thumb);

        var fields = el('div', { class: 'editor-fields' });
        var textInput = el('input', { type: 'text', placeholder: isItem ? 'Название раздела' : 'Название категории', value: entry.label });
        textInput.addEventListener('input', function (e) { entry.label = e.target.value; });
        fields.appendChild(textInput);

        if (!isItem) {
          var descInput = el('input', { type: 'text', placeholder: 'Короткое описание категории (необязательно)', value: entry.description || '' });
          descInput.addEventListener('input', function (e) { entry.description = e.target.value; });
          fields.appendChild(descInput);
        }
        row.appendChild(fields);

        var fileBtn = el('label', { class: 'icon-btn file-btn', title: 'Загрузить картинку' }, []);
        fileBtn.innerHTML = '🖼️';
        var fileInput = el('input', { type: 'file', accept: 'image/*' });
        fileInput.addEventListener('change', function (e) {
          var file = e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            entry.image = reader.result;
            thumb.src ? (thumb.src = entry.image) : null;
            if (thumb.tagName === 'DIV') {
              var newThumb = el('img', { class: 'thumb', src: entry.image });
              row.replaceChild(newThumb, thumb);
              thumb = newThumb;
            } else {
              thumb.src = entry.image;
            }
          };
          reader.readAsDataURL(file);
        });
        fileBtn.appendChild(fileInput);
        row.appendChild(fileBtn);

        var delBtn = el('button', { class: 'icon-btn danger', text: '✕', title: 'Удалить', onclick: function () {
          var idx = list.indexOf(entry);
          if (idx > -1) list.splice(idx, 1);
          renderList(container, list, isItem);
        }});
        row.appendChild(delBtn);

        container.appendChild(row);
      });
    }

    renderList(catList, state.categories, false);
    renderList(itemList, state.items, true);

    function onPublish() {
      errorBox.textContent = '';
      var cleanCats = state.categories.filter(function (c) { return c.label.trim() || c.image; });
      var cleanItems = state.items.filter(function (i) { return i.label.trim() || i.image; });
      if (cleanCats.length < 2) { errorBox.textContent = 'Добавьте минимум 2 категории.'; return; }
      if (cleanItems.length < 1) { errorBox.textContent = 'Добавьте минимум 1 раздел.'; return; }
      if (APPS_SCRIPT_URL.indexOf('http') !== 0) {
        errorBox.textContent = 'Не задан APPS_SCRIPT_URL в коде страницы — вставьте URL развёрнутого Apps Script (см. инструкцию деплоя).';
        return;
      }

      publishBtn.disabled = true;
      publishBtn.textContent = 'Публикация...';

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'saveConfig', categories: cleanCats, items: cleanItems })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          publishBtn.disabled = false;
          publishBtn.textContent = 'Опубликовать и получить ссылку';
          if (!res.ok) { errorBox.textContent = 'Ошибка публикации: ' + (res.error || 'неизвестная ошибка'); return; }
          var link = window.location.origin + window.location.pathname + '?s=' + res.sessionId;
          linkBox.className = 'link-box show';
          linkBox.innerHTML = '';
          linkBox.appendChild(el('h2', { text: 'Ссылка для респондентов готова' }));
          var row = el('div', { class: 'link-row' });
          var linkInput = el('input', { type: 'text', value: link, readonly: 'readonly' });
          var copyBtn = el('button', { text: 'Скопировать', onclick: function () {
            linkInput.select();
            navigator.clipboard && navigator.clipboard.writeText(link);
            copyBtn.textContent = 'Скопировано!';
            setTimeout(function () { copyBtn.textContent = 'Скопировать'; }, 1500);
          }});
          row.appendChild(linkInput);
          row.appendChild(copyBtn);
          linkBox.appendChild(row);
          linkBox.appendChild(el('p', { class: 'hint', text: 'Каждый респондент, открывший эту ссылку, увидит чистую страницу с этими категориями и разделами.' }));
        })
        .catch(function (err) {
          publishBtn.disabled = false;
          publishBtn.textContent = 'Опубликовать и получить ссылку';
          errorBox.textContent = 'Не удалось связаться с сервером: ' + err.message;
        });
    }
  }

  // ---------------------------------------------------------------------
  // РЕЖИМ РЕСПОНДЕНТА (?s=SESSION_ID)
  // ---------------------------------------------------------------------
  function renderRespondentLoading() {
    app.innerHTML = '';
    app.appendChild(el('div', { class: 'center-screen' }, [
      el('h2', { text: 'Загрузка...' }),
      el('p', { class: 'sub', text: 'Пожалуйста, подождите.' })
    ]));
  }

  function renderRespondentError(message) {
    app.innerHTML = '';
    app.appendChild(el('div', { class: 'center-screen' }, [
      el('h2', { text: 'Не удалось загрузить сортировку' }),
      el('p', { class: 'sub', text: message })
    ]));
  }

  function renderThankYou() {
    app.innerHTML = '';
    app.appendChild(el('div', { class: 'center-screen' }, [
      el('h2', { text: 'Спасибо!' }),
      el('p', { class: 'sub', text: 'Ваши ответы сохранены. Можно закрыть эту страницу.' })
    ]));
  }

  function renderRespondent(config) {
    var submitted = false;
    var placement = {}; // itemId -> categoryId

    var itemLabel = {};
    config.items.forEach(function (item, idx) { itemLabel[item.id] = item.label || ('Раздел ' + (idx + 1)); });

    var catLabel = {};
    config.categories.forEach(function (cat, idx) { catLabel[cat.id] = cat.label || ('Категория ' + (idx + 1)); });

    var queue = config.items.slice();
    var assignedByCategory = {};
    config.categories.forEach(function (cat) { assignedByCategory[cat.id] = []; });

    app.innerHTML = '';

    var progressEl = el('div', { class: 'sort-progress' });
    app.appendChild(el('div', { class: 'sort-header' }, [
      el('h1', { text: 'Карточная сортировка' }),
      progressEl
    ]));

    var remainingEl = el('div', { class: 'sort-remaining' });
    app.appendChild(el('div', { class: 'sort-subheader' }, [
      el('div', { class: 'sort-hint', text: 'Перетащите карточку вправо или нажмите на категорию' }),
      remainingEl
    ]));

    var columns = el('div', { class: 'sort-columns' });

    var queueCol = el('div', { class: 'sort-column' });
    queueCol.appendChild(el('div', { class: 'col-title', text: 'Очередь карточек' }));
    var queueList = el('div', { class: 'queue-list' });
    queueCol.appendChild(queueList);

    var catsColTitle = el('div', { class: 'col-title' });
    var catsCol = el('div', { class: 'sort-column' });
    catsCol.appendChild(catsColTitle);
    var catsList = el('div', { class: 'cats-list' });
    catsCol.appendChild(catsList);

    columns.appendChild(queueCol);
    columns.appendChild(catsCol);
    app.appendChild(columns);

    var actionsBar = el('div', { class: 'actions-bar' });
    var finishBtn = el('button', { class: 'primary-btn', text: 'Завершить', disabled: 'disabled', onclick: onFinish });
    actionsBar.appendChild(finishBtn);
    app.appendChild(actionsBar);
    var errorBox = el('div', { class: 'error-msg' });
    app.appendChild(errorBox);

    var dragState = null;

    function pluralCategories(n) {
      if (n === 1) return 'категория';
      if (n >= 2 && n <= 4) return 'категории';
      return 'категорий';
    }

    function updateHeader() {
      var done = Object.keys(placement).length;
      var total = config.items.length;
      progressEl.textContent = done + ' / ' + total + ' распределено';
      remainingEl.textContent = 'Осталось: ' + queue.length;
      catsColTitle.textContent = config.categories.length + ' ' + pluralCategories(config.categories.length);
      finishBtn.disabled = queue.length > 0;
    }

    function assign(item, cat) {
      var idx = queue.indexOf(item);
      if (idx === -1) return;
      queue.splice(idx, 1);
      placement[item.id] = cat.id;
      assignedByCategory[cat.id].push(item);
      renderQueue();
      renderCategories();
      updateHeader();
    }

    function unassign(item, cat) {
      var arr = assignedByCategory[cat.id];
      var idx = arr.indexOf(item);
      if (idx === -1) return;
      arr.splice(idx, 1);
      delete placement[item.id];
      queue.unshift(item);
      renderQueue();
      renderCategories();
      updateHeader();
    }

    function renderQueue() {
      queueList.innerHTML = '';
      queue.forEach(function (item, i) {
        var isActive = i === 0;
        var top = el('div', { class: 'queue-card-top' });
        if (item.image) top.appendChild(el('img', { class: 'queue-card-thumb', src: item.image, draggable: 'false' }));
        top.appendChild(el('div', { class: 'queue-card-title', text: itemLabel[item.id] }));

        var meta = el('div', { class: 'queue-card-meta' }, [
          el('span', { class: 'queue-index', text: '#' + (config.items.indexOf(item) + 1) }),
          el('span', { class: 'queue-status', text: isActive ? 'Тянуть →' : 'В очереди' })
        ]);

        var card = el('div', { class: 'queue-card' + (isActive ? ' active' : '') }, [top, meta]);
        if (isActive && !submitted) attachDrag(card, item);
        queueList.appendChild(card);
      });
    }

    function renderCategories() {
      catsList.innerHTML = '';
      config.categories.forEach(function (cat) {
        var assigned = assignedByCategory[cat.id];

        var titleWrap = el('div', { class: 'cat-title' });
        if (cat.image) titleWrap.appendChild(el('img', { class: 'cat-thumb', src: cat.image, draggable: 'false' }));
        titleWrap.appendChild(el('span', { text: catLabel[cat.id] }));

        var head = el('div', { class: 'cat-row-head' }, [titleWrap]);
        if (assigned.length > 0) head.appendChild(el('div', { class: 'cat-badge', text: String(assigned.length) }));

        var row = el('div', { class: 'cat-row', 'data-category-id': cat.id }, [head]);

        if (assigned.length > 0) {
          var chips = el('div', { class: 'cat-chips' });
          assigned.forEach(function (item) {
            var removeBtn = el('button', { class: 'cat-chip-remove', text: '✕', title: 'Убрать из категории', onclick: function (e) {
              e.stopPropagation();
              unassign(item, cat);
            }});
            chips.appendChild(el('div', { class: 'cat-chip' }, [el('span', { text: itemLabel[item.id] }), removeBtn]));
          });
          row.appendChild(chips);
        }

        row.addEventListener('click', function () {
          if (submitted || queue.length === 0) return;
          assign(queue[0], cat);
        });

        catsList.appendChild(row);
      });
    }

    // --- pointer-based drag & drop (работает и мышью, и тачем) — доступно только активной карточке ---
    function attachDrag(card, item) {
      card.addEventListener('pointerdown', function (e) {
        if (submitted) return;
        e.preventDefault();
        var rect = card.getBoundingClientRect();
        var ghost = card.cloneNode(true);
        ghost.className = 'queue-card active drag-ghost';
        ghost.style.left = rect.left + 'px';
        ghost.style.top = rect.top + 'px';
        document.body.appendChild(ghost);
        card.classList.add('dragging');

        dragState = { item: item, card: card, ghost: ghost, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top, hoveredRow: null };
        card.setPointerCapture && card.setPointerCapture(e.pointerId);
      });

      card.addEventListener('pointermove', function (e) { handleMove(e); });
      card.addEventListener('pointerup', function (e) { handleUp(); });
      card.addEventListener('pointercancel', function (e) { handleUp(); });
    }

    function handleMove(e) {
      if (!dragState) return;
      dragState.ghost.style.left = (e.clientX - dragState.offsetX) + 'px';
      dragState.ghost.style.top = (e.clientY - dragState.offsetY) + 'px';

      dragState.ghost.style.display = 'none';
      var target = document.elementFromPoint(e.clientX, e.clientY);
      dragState.ghost.style.display = '';

      var row = target ? target.closest('.cat-row') : null;
      if (dragState.hoveredRow && dragState.hoveredRow !== row) {
        dragState.hoveredRow.classList.remove('drop-hover');
      }
      if (row) row.classList.add('drop-hover');
      dragState.hoveredRow = row;
    }

    function handleUp() {
      if (!dragState) return;
      var ds = dragState;
      dragState = null;

      ds.card.classList.remove('dragging');
      if (ds.ghost.parentNode) ds.ghost.parentNode.removeChild(ds.ghost);
      if (ds.hoveredRow) ds.hoveredRow.classList.remove('drop-hover');

      var categoryId = ds.hoveredRow ? ds.hoveredRow.getAttribute('data-category-id') : null;
      var cat = categoryId ? config.categories.filter(function (c) { return c.id === categoryId; })[0] : null;
      if (cat) assign(ds.item, cat);
      // если бросили не на категорию — карточка остаётся в очереди
    }

    function onFinish() {
      if (submitted) return;
      if (queue.length > 0) return;
      submitted = true;
      finishBtn.disabled = true;
      finishBtn.textContent = 'Отправка...';

      var answers = {};
      Object.keys(placement).forEach(function (itemId) {
        answers[itemLabel[itemId]] = catLabel[placement[itemId]];
      });

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submitResponse',
          sessionId: sessionId,
          respondentId: uid(),
          answers: answers
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) {
            submitted = false;
            finishBtn.disabled = false;
            finishBtn.textContent = 'Завершить';
            errorBox.textContent = 'Ошибка отправки: ' + (res.error || 'неизвестная ошибка');
            return;
          }
          renderThankYou();
        })
        .catch(function (err) {
          submitted = false;
          finishBtn.disabled = false;
          finishBtn.textContent = 'Завершить';
          errorBox.textContent = 'Не удалось связаться с сервером: ' + err.message;
        });
    }

    renderQueue();
    renderCategories();
    updateHeader();
  }

  function loadRespondent() {
    renderRespondentLoading();
    if (APPS_SCRIPT_URL.indexOf('http') !== 0) {
      renderRespondentError('Страница не настроена (не задан APPS_SCRIPT_URL). Обратитесь к исследователю.');
      return;
    }
    fetch(APPS_SCRIPT_URL + '?action=getConfig&s=' + encodeURIComponent(sessionId))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) { renderRespondentError(res.error || 'Сессия не найдена.'); return; }
        renderRespondent(res.config);
      })
      .catch(function (err) { renderRespondentError('Ошибка сети: ' + err.message); });
  }

  if (sessionId) {
    loadRespondent();
  } else {
    renderAdmin();
  }
})();
</script>
</body>
</html>
